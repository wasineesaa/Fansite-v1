<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EVAN — Photo Collection</title>
    <!-- ใช้ไฟล์ styles.css ร่วมกันตามมาตรฐาน External CSS[cite: 96] -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts[cite: 212] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Prompt:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
</head>
<body class="gallery-body">

    <div class="gallery-page-wrap">
        
        <!-- Header Section (ปรับข้อความเป็นรูปภาพปกติทั่วไป) -->
        <header class="gallery-head-area">
            <h1 class="gallery-main-title">PHOTO COLLECTION</h1>
            <p class="gallery-sub-info">EVAN : DAILY &amp; OFFICIAL PHOTOS</p>
            
            <!-- ปุ่มย้อนกลับหน้าหลัก index.html[cite: 46, 48] -->
            <div class="nav-back-wrap">
                <a href="index.html" class="cute-back-btn">⬅ BACK TO HOME</a>
            </div>
        </header>

        <!-- แสดงรูปภาพปกติ 6 ภาพ (ไม่มีคำบรรยายใต้รูป) -->
        <main class="scrapbook-canvas">
            
            <!-- รูปที่ 1 -->
            <article class="polaroid-card card-tilt-left">
                <div class="tape-strip"></div>
                <div class="photo-inner">
                    <img src="EVAN3.jpeg" alt="EVAN photo 1">
                </div>
            </article>

            <!-- รูปที่ 2 -->
            <article class="polaroid-card card-tilt-right">
                <div class="tape-strip tape-black"></div>
                <div class="photo-inner">
                    <img src="EVAN5.jpeg" alt="EVAN photo 2">
                </div>
            </article>

            <!-- รูปที่ 3 -->
            <article class="polaroid-card card-featured">
                <div class="tape-strip tape-center"></div>
                <div class="photo-inner">
                    <img src="EVAN11.jpeg" alt="EVAN photo 3">
                </div>
            </article>

            <!-- รูปที่ 4 -->
            <article class="polaroid-card card-tilt-slight-right">
                <div class="tape-strip"></div>
                <div class="photo-inner">
                    <img src="EVAN9.jpeg" alt="EVAN photo 4">
                </div>
            </article>

            <!-- รูปที่ 5 -->
            <article class="polaroid-card card-tilt-left-deep">
                <div class="tape-strip tape-black"></div>
                <div class="photo-inner">
                    <img src="EVAN10.jpeg" alt="EVAN photo 5">
                </div>
            </article>

            <!-- รูปที่ 6 -->
            <article class="polaroid-card card-tilt-slight-left">
                <div class="tape-strip tape-center"></div>
                <div class="photo-inner">
                    <img src="EVAN7.jpeg" alt="EVAN photo 6">
                </div>
            </article>

        </main>

        <!-- Footer[cite: 130] -->
        <footer class="bottom-container gallery-footer-custom">
            <p class="copyright">© 2026 WASINEE S. X  EVAN FANSITE</p>
        </footer>

    </div>

</body>
</html>
